---
name: matchcmp
title: Compare Matching and Weighting Estimators
jrs: '1.1'

items:
    - name: guide
      title: Data and setup guide
      type: Html
      visible: (showGuide)

    - name: helpText
      title: Method notes
      type: Html
      visible: (showHelp)

    - name: notes
      title: Notes
      type: Html
      visible: true

    - name: est
      title: 'Estimates by method'
      type: Table
      visible: true
      clearWith:
          - outcome
          - treat
          - covs
          - estimand
          - link
          - k
          - biasadj
          - moments
          - doNaive
          - doRa
          - doIpw
          - doAipw
          - doIpwra
          - doNn
          - doEbal
          - level
      columns:
          - name: estimand
            title: 'Estimand'
            type: text
          - name: method
            title: 'Estimator'
            type: text
          - name: estimate
            title: 'Effect'
            type: number
          - name: se
            title: 'Std. error'
            type: number
          - name: p
            title: 'p'
            type: number
            format: zto,pvalue
          - name: lo
            title: 'CI lower'
            type: number
          - name: hi
            title: 'CI upper'
            type: number
          - name: smd
            title: 'Largest |std. diff.|'
            type: number
            superTitle: Balance after adjustment
          - name: above
            title: 'Variables above 0.1'
            type: integer
            superTitle: Balance after adjustment

    - name: forest
      title: 'Effect estimates with confidence intervals'
      type: Image
      width: 640
      height: 560
      renderFun: .plotForest
      visible: (plot)
      clearWith:
          - outcome
          - treat
          - covs
          - estimand
          - link
          - k
          - biasadj
          - moments
          - doNaive
          - doRa
          - doIpw
          - doAipw
          - doIpwra
          - doNn
          - doEbal
          - level

