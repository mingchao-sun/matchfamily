---
name: matchcmp
title: Compare Matching and Weighting Estimators
jas: '1.2'
version: '1.0.0'
menuGroup: Matching
menuSubgroup: Estimation
menuTitle: Compare Estimators
menuSubtitle: Side by side, same data and estimand

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treat
      title: Treatment (0/1)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: estimand
      title: Estimand
      type: List
      options:
          - name: all
            title: 'All three: ATE, ATT and ATC'
          - name: ate
            title: 'Average treatment effect (ATE)'
          - name: att
            title: 'Effect on the treated (ATT)'
          - name: atc
            title: 'Effect on the controls (ATC)'
      default: all

    - name: link
      title: Propensity score model
      type: List
      options:
          - name: logit
            title: 'Logit'
          - name: probit
            title: 'Probit'
      default: logit

    - name: doNaive
      title: Unadjusted difference in means
      type: Bool
      default: true

    - name: doRa
      title: Regression adjustment (RA)
      type: Bool
      default: true

    - name: doIpw
      title: Inverse probability weighting (IPW)
      type: Bool
      default: true

    - name: doAipw
      title: Augmented IPW (AIPW)
      type: Bool
      default: true

    - name: doIpwra
      title: IPW regression adjustment (IPWRA)
      type: Bool
      default: true

    - name: doNn
      title: Nearest-neighbour matching
      type: Bool
      default: true

    - name: doEbal
      title: Entropy balancing
      type: Bool
      default: true

    - name: k
      title: Number of neighbours for matching
      type: Integer
      default: 1
      min: 1
      max: 50

    - name: biasadj
      title: Bias adjustment for matching
      type: Bool
      default: true

    - name: moments
      title: Moments for entropy balancing
      type: List
      options:
          - name: m1
            title: 'Means'
          - name: m2
            title: 'Means and variances'
          - name: m3
            title: 'Means, variances and skewness'
      default: m1

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: plot
      title: Forest plot
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

...
