---
title: Matching and Weighting Family
name: matchfamily
version: 1.0.0
jms: '1.0'
authors:
  - Mingchao Sun
maintainer: Mingchao Sun <mingchao.sun@hotmail.com>
date: '2026-11-20'
type: R
description: >-
  Treatment effects under selection on observables: propensity score and
  overlap, covariate balance, regression adjustment, inverse probability
  weighting, augmented IPW, IPW regression adjustment, entropy balancing and
  nearest-neighbour matching, with standard errors that account for the
  estimated propensity score or the matching; a side-by-side comparison of the
  estimators; and sensitivity analysis (E-value, Rosenbaum bounds).
datasets:
  - name: LaLonde job training (Dehejia and Wahba sample)
    path: lalonde.omv
    description: >-
      614 men: treated (NSW job training) and PSID comparison group (lalonde,
      MatchIt package). Outcome re78 (earnings in 1978), treatment treat,
      covariates age, educ, race (Nominal), married, nodegree, re74, re75. The
      experimental benchmark is about 1,800 dollars.
  - name: Simulated confounded treatment
    path: sim_confounded.csv
    description: >-
      Simulated, 3,000 rows, good overlap: outcome y, treatment treat,
      covariates x1, x2, x3. The effect is 1 + 0.5 x1, so ATE is 0.99, ATT 1.16
      and ATC 0.83 in the sample.
  - name: Simulated poor overlap
    path: sim_overlap.csv
    description: >-
      Simulated, 3,000 rows: strong selection on x1 leaves some treated units
      without comparable controls. Outcome y, treatment treat, covariates x1,
      x2; the true effect is 1.5.
  - name: Simulated hidden confounder
    path: sim_hidden.csv
    description: >-
      Simulated, 2,000 rows with a confounder not in the data: outcome y,
      treatment treat, covariates x1, x2; the true effect is 1.
analyses:
  - name: psmodel
