            type: number
          - name: z
            title: 'z'
            type: number
          - name: p
            title: 'p'
            type: number
            format: zto,pvalue
          - name: lo
            title: 'CI lower'
            type: number
          - name: hi
            title: 'CI upper'
            type: number

    - name: summary
      title: 'Matching summary'
      type: Table
      visible: true
