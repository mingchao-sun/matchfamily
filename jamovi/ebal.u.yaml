title: Entropy Balancing
name: ebal
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment (0/1)
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Sampling weights
            children:
                - type: VariablesListBox
                  name: weights
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Cluster variable
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: Estimand and moments
      collapsed: true
      children:
          - type: ComboBox
            name: estimand
          - type: ComboBox
            name: moments
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
    - type: CollapseBox
      label: Tables
      collapsed: true
      children:
          - type: CheckBox
            name: showPom
          - type: CheckBox
            name: showWeights
          - type: CheckBox
            name: showBalance
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
