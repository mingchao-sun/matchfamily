---
name: psmodel
title: Propensity Score and Overlap
jas: '1.2'
version: '1.0.0'
menuGroup: Matching
menuSubgroup: Preparation
menuTitle: Propensity Score and Overlap
menuSubtitle: Model, overlap and trimming

options:
    - name: data
      type: Data

    - name: treat
      title: Treatment (0/1)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: weights
      title: Sampling weights
      type: Variable
      permitted:
          - numeric

    - name: link
      title: Propensity score model
      type: List
      options:
          - name: logit
            title: 'Logit'
          - name: probit
            title: 'Probit'
      default: logit

    - name: trim
      title: Trim observations by propensity score
      type: List
      options:
          - name: none
            title: 'No trimming'
          - name: minmax
            title: 'Outside the common range of the two groups'
          - name: crump
            title: 'Outside 0.1 to 0.9'
          - name: custom
            title: 'Outside the bounds below'
      default: none

    - name: trimLo
      title: Lower bound
      type: Number
      default: 0.05
      min: 0
      max: 0.5

    - name: trimHi
      title: Upper bound
      type: Number
      default: 0.95
      min: 0.5
      max: 1

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: plot
      title: Propensity score distribution
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

...
