title: Matching Estimators
name: nnmatch
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment (0/1)
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Matching covariates
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Bias-adjustment covariates (default matching covariates)
            children:
                - type: VariablesListBox
                  name: adjvars
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Exact-match variables
            children:
                - type: VariablesListBox
                  name: exact
                  isTarget: true
                  height: small
    - type: CollapseBox
      label: Estimand and matching
      collapsed: true
      children:
          - type: ComboBox
            name: estimand
          - type: TextBox
            name: k
            label: Number of neighbours
            format: number
          - type: ComboBox
            name: metric
          - type: TextBox
            name: caliper
            label: Caliper (distance units; 0 = none)
            format: number
          - type: CheckBox
            name: biasadj
          - type: TextBox
            name: varNn
            label: Neighbours for the variance estimate
            format: number
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
    - type: CollapseBox
      label: Tables
      collapsed: true
      children:
          - type: CheckBox
            name: showMatches
          - type: CheckBox
            name: showBalance
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
