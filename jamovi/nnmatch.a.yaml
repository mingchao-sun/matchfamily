---
name: nnmatch
title: Matching Estimators
jas: '1.2'
version: '1.0.0'
menuGroup: Matching
menuSubgroup: Estimation
menuTitle: Matching Estimators
menuSubtitle: Nearest-neighbour matching

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treat
      title: Treatment (0/1)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Matching covariates
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: adjvars
      title: Bias-adjustment covariates
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: exact
      title: Exact-match variables
      type: Variables
      suggested:
          - nominal
          - ordinal
      permitted:
          - numeric
          - factor

    - name: estimand
      title: Estimand
      type: List
      options:
          - name: all
            title: 'All three: ATE, ATT and ATC'
          - name: ate
            title: 'Average treatment effect (ATE)'
          - name: att
            title: 'Effect on the treated (ATT)'
          - name: atc
            title: 'Effect on the controls (ATC)'
      default: all

    - name: k
      title: Number of neighbours
      type: Integer
      default: 1
      min: 1
      max: 50

    - name: metric
      title: Distance
      type: List
      options:
          - name: maha
            title: 'Mahalanobis'
          - name: ivar
            title: 'Inverse variance (diagonal)'
          - name: eucl
            title: 'Euclidean'
      default: maha

    - name: biasadj
      title: Bias adjustment (Abadie and Imbens 2011)
      type: Bool
      default: false

    - name: caliper
      title: Caliper (distance units; 0 = none)
      type: Number
      default: 0
      min: 0

    - name: varNn
      title: Neighbours for the variance estimate
      type: Integer
      default: 2
      min: 1
      max: 20

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: showMatches
      title: Matches per unit
      type: Bool
      default: true

    - name: showBalance
      title: Balance after matching
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

...
