            type: number
            superTitle: Unadjusted
          - name: smd
            title: 'Std. diff.'
            type: number
            superTitle: Unadjusted
          - name: am1
            title: 'Treated mean'
            type: number
            superTitle: After balancing
          - name: am0
            title: 'Control mean'
            type: number
            superTitle: After balancing
          - name: asmd
            title: 'Std. diff.'
            type: number
            superTitle: After balancing
          - name: avr
            title: 'Var. ratio'
            type: number
            superTitle: After balancing

