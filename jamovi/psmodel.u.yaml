title: Propensity Score and Overlap
name: psmodel
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Treatment (0/1)
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Sampling weights
            children:
                - type: VariablesListBox
                  name: weights
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: Model and trimming
      collapsed: true
      children:
          - type: ComboBox
            name: link
          - type: ComboBox
            name: trim
          - type: TextBox
            name: trimLo
            label: Lower bound
            format: number
            enable: (trim:custom)
          - type: TextBox
            name: trimHi
            label: Upper bound
            format: number
            enable: (trim:custom)
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
