---
name: wtest
title: Weighting and Doubly Robust Estimators
jas: '1.2'
version: '1.0.0'
menuGroup: Matching
menuSubgroup: Estimation
menuTitle: Weighting and Doubly Robust Estimators
menuSubtitle: RA, IPW, AIPW, IPWRA

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treat
      title: Treatment (0/1)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: extra
      title: Additional outcome-model covariates
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: weights
      title: Sampling weights
      type: Variable
      permitted:
          - numeric

    - name: cluster
      title: Cluster variable
      type: Variable
      permitted:
          - factor
          - id
          - numeric

    - name: estimand
      title: Estimand
      type: List
      options:
          - name: all
            title: 'All three: ATE, ATT and ATC'
          - name: ate
            title: 'Average treatment effect (ATE)'
          - name: att
            title: 'Effect on the treated (ATT)'
          - name: atc
            title: 'Effect on the controls (ATC)'
          - name: ato
            title: 'Overlap-weighted effect (ATO)'
      default: all

    - name: doRa
      title: Regression adjustment (RA)
      type: Bool
      default: true

    - name: doIpw
      title: Inverse probability weighting (IPW)
      type: Bool
      default: true

    - name: doAipw
      title: Augmented IPW (AIPW)
      type: Bool
      default: true

    - name: doIpwra
      title: IPW regression adjustment (IPWRA)
      type: Bool
      default: true

    - name: link
      title: Propensity score model
      type: List
      options:
          - name: logit
            title: 'Logit'
          - name: probit
            title: 'Probit'
          - name: cbps
            title: 'Covariate balancing (CBPS, exact)'
      default: logit

    - name: trim
      title: Trim observations by propensity score
      type: List
      options:
          - name: none
            title: 'No trimming'
          - name: minmax
            title: 'Outside the common range of the two groups'
          - name: crump
            title: 'Outside 0.1 to 0.9'
          - name: custom
            title: 'Outside the bounds below'
      default: none

    - name: trimLo
      title: Lower bound
      type: Number
      default: 0.05
      min: 0
      max: 0.5

    - name: trimHi
      title: Upper bound
      type: Number
      default: 0.95
      min: 0.5
      max: 1

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: showPom
      title: Potential-outcome means
      type: Bool
      default: false

    - name: showWeights
      title: Weight diagnostics
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

...
