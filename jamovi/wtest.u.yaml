title: Weighting and Doubly Robust Estimators
name: wtest
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment (0/1)
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates (propensity score)
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Extra outcome-model covariates
            children:
                - type: VariablesListBox
                  name: extra
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Sampling weights
            children:
                - type: VariablesListBox
                  name: weights
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Cluster variable
            children:
                - type: VariablesListBox
                  name: cluster
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: Estimand and estimators
      collapsed: true
      children:
          - type: ComboBox
            name: estimand
          - type: CheckBox
            name: doRa
          - type: CheckBox
            name: doIpw
          - type: CheckBox
            name: doAipw
          - type: CheckBox
            name: doIpwra
          - type: ComboBox
            name: link
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
    - type: CollapseBox
      label: Trimming
      collapsed: true
      children:
          - type: ComboBox
            name: trim
          - type: TextBox
            name: trimLo
            label: Lower bound
            format: number
            enable: (trim:custom)
          - type: TextBox
            name: trimHi
            label: Upper bound
            format: number
            enable: (trim:custom)
    - type: CollapseBox
      label: Tables
      collapsed: true
      children:
          - type: CheckBox
            name: showPom
          - type: CheckBox
            name: showWeights
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
