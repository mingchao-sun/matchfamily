---
name: ebal
title: Entropy Balancing
jas: '1.2'
version: '1.0.0'
menuGroup: Matching
menuSubgroup: Estimation
menuTitle: Entropy Balancing
menuSubtitle: Weights that match the covariate moments exactly

options:
    - name: data
      type: Data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treat
      title: Treatment (0/1)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: weights
      title: Sampling weights
      type: Variable
      permitted:
          - numeric

    - name: cluster
      title: Cluster variable
      type: Variable
      permitted:
          - factor
          - id
          - numeric

    - name: estimand
      title: Estimand
      type: List
      options:
          - name: all
            title: 'All three: ATE, ATT and ATC'
          - name: ate
            title: 'Average treatment effect (ATE)'
          - name: att
            title: 'Effect on the treated (ATT)'
          - name: atc
            title: 'Effect on the controls (ATC)'
      default: all

    - name: moments
      title: Moments to balance
      type: List
      options:
          - name: m1
            title: 'Means'
          - name: m2
            title: 'Means and variances'
          - name: m3
            title: 'Means, variances and skewness'
      default: m1

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: showPom
      title: Potential-outcome means
      type: Bool
      default: false

    - name: showWeights
      title: Weight diagnostics
      type: Bool
      default: true

    - name: showBalance
      title: Balance table
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

...
