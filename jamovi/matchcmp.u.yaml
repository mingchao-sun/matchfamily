title: Compare Matching and Weighting Estimators
name: matchcmp
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Outcome
            children:
                - type: VariablesListBox
                  name: outcome
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Treatment (0/1)
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
    - type: CollapseBox
      label: Estimand and estimators
      collapsed: true
      children:
          - type: ComboBox
            name: estimand
          - type: ComboBox
            name: link
          - type: CheckBox
            name: doNaive
          - type: CheckBox
            name: doRa
          - type: CheckBox
            name: doIpw
          - type: CheckBox
            name: doAipw
          - type: CheckBox
            name: doIpwra
          - type: CheckBox
            name: doNn
          - type: CheckBox
            name: doEbal
          - type: TextBox
            name: level
            label: Confidence level (%)
            format: number
    - type: CollapseBox
      label: Matching and balancing options
      collapsed: true
      children:
          - type: TextBox
            name: k
            label: Number of neighbours for matching
            format: number
          - type: CheckBox
            name: biasadj
          - type: ComboBox
            name: moments
    - type: CollapseBox
      label: Plot
      collapsed: true
      children:
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
