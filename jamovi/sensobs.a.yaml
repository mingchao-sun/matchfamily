---
name: sensobs
title: Sensitivity to Unobserved Confounding
jas: '1.2'
version: '1.0.0'
menuGroup: Matching
menuSubgroup: Sensitivity
menuTitle: Sensitivity to Unobserved Confounding
menuSubtitle: E-value and Rosenbaum bounds

options:
    - name: data
      type: Data

    - name: mode
      title: Effect to assess
      type: List
      options:
          - name: data
            title: 'Estimate it from the data (AIPW)'
          - name: manual
            title: 'Enter an estimate and its confidence limits'
      default: data

    - name: outcome
      title: Outcome
      type: Variable
      suggested:
          - continuous
      permitted:
          - numeric

    - name: treat
      title: Treatment (0/1)
      type: Variable
      permitted:
          - numeric
          - factor

    - name: covs
      title: Covariates
      type: Variables
      suggested:
          - continuous
          - nominal
      permitted:
          - numeric
          - factor

    - name: estimand
      title: Estimand
      type: List
      options:
          - name: ate
            title: 'Average treatment effect (ATE)'
          - name: att
            title: 'Effect on the treated (ATT)'
          - name: atc
            title: 'Effect on the controls (ATC)'
      default: ate

    - name: link
      title: Propensity score model
      type: List
      options:
          - name: logit
            title: 'Logit'
          - name: probit
            title: 'Probit'
      default: logit

    - name: mType
      title: Effect measure
      type: List
      options:
          - name: smd
            title: 'Standardised mean difference'
          - name: rr
            title: 'Risk ratio'
          - name: or_rare
            title: 'Odds ratio, rare outcome'
          - name: or_common
            title: 'Odds ratio, common outcome'
          - name: hr_rare
            title: 'Hazard ratio, rare outcome'
          - name: hr_common
            title: 'Hazard ratio, common outcome'
      default: rr

    - name: mEst
      title: Estimate
      type: Number
      default: 1.5

    - name: mLo
      title: Lower confidence limit
      type: Number
      default: 1.2

    - name: mHi
      title: Upper confidence limit
      type: Number
      default: 1.9

    - name: doRosenbaum
      title: Rosenbaum bounds (matched pairs)
      type: Bool
      default: true

    - name: k
      title: Matches per treated unit (Rosenbaum)
      type: Integer
      default: 1
      min: 1
      max: 10

    - name: gammaMax
      title: Largest Gamma (Rosenbaum)
      type: Number
      default: 3
      min: 1.1
      max: 20

    - name: gammaStep
      title: Gamma step (Rosenbaum)
      type: Number
      default: 0.25
      min: 0.01
      max: 5

    - name: level
      title: Confidence level (%)
      type: Number
      default: 95
      min: 50
      max: 99.9

    - name: plot
      title: Plot of the p-value bounds
      type: Bool
      default: true

    - name: showHelp
      title: Method notes
      type: Bool
      default: false

    - name: showGuide
      title: Data and setup guide
      type: Bool
      default: false

...
