title: Covariate Balance
name: balance
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
          - type: TargetLayoutBox
            label: Treatment (0/1)
            children:
                - type: VariablesListBox
                  name: treat
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Covariates
            children:
                - type: VariablesListBox
                  name: covs
                  isTarget: true
                  height: small
          - type: TargetLayoutBox
            label: Sampling weights
            children:
                - type: VariablesListBox
                  name: weights
                  isTarget: true
                  height: small
                  maxItemCount: 1
          - type: TargetLayoutBox
            label: Weights variable (for 'Weights from a variable')
            children:
                - type: VariablesListBox
                  name: adjW
                  isTarget: true
                  height: small
                  maxItemCount: 1
    - type: CollapseBox
      label: Adjustment
      collapsed: true
      children:
          - type: ComboBox
            name: adjust
          - type: ComboBox
            name: estimand
          - type: ComboBox
            name: link
          - type: ComboBox
            name: moments
    - type: CollapseBox
      label: Statistics
      collapsed: true
      children:
          - type: ComboBox
            name: denom
          - type: CheckBox
            name: stdBinary
          - type: TextBox
            name: threshold
            label: Balance threshold
            format: number
          - type: CheckBox
            name: showMeans
          - type: CheckBox
            name: showVr
          - type: CheckBox
            name: showKs
          - type: CheckBox
            name: plot
    - type: CollapseBox
      label: Output
      collapsed: true
      children:
          - type: CheckBox
            name: showHelp
            label: Method notes
          - type: CheckBox
            name: showGuide
            label: Data and setup guide
