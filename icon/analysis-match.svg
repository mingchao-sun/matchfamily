  <!-- matches: each treated unit is joined to its nearest comparison unit -->
  <path d="M19 11 L55 8" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M19 22 L55 22" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M19 33 L55 36" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M19 22 L55 8" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="1.8 2.6"/>
  <!-- treated (orange, larger when it carries more weight) and comparison units (blue), white fill and coloured outline as in the built-in icons -->
  <circle cx="12" cy="11" r="5.4" fill="#ffffff" stroke="#e6ac40" stroke-width="2.6"/>
  <circle cx="12" cy="22" r="5.4" fill="#ffffff" stroke="#e6ac40" stroke-width="2.6"/>
  <circle cx="12" cy="33" r="5.4" fill="#ffffff" stroke="#e6ac40" stroke-width="2.6"/>
  <circle cx="62" cy="8" r="6.6" fill="#ffffff" stroke="#6b9de8" stroke-width="2.6"/>
  <circle cx="62" cy="22" r="4.4" fill="#ffffff" stroke="#6b9de8" stroke-width="2.6"/>
  <circle cx="62" cy="36" r="5" fill="#ffffff" stroke="#6b9de8" stroke-width="2.6"/>
</svg>
